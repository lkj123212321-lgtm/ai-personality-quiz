 shuffle(QUESTION_BANK.filter(q=>!used.has(q.id))).slice(0,2).forEach(q=>chosen.push(q));
 return shuffle(chosen);
}
function scores(){
 const totals=Object.fromEntries(L.map(k=>[k,0])), counts=Object.fromEntries(L.map(k=>[k,0]));
 state.questions.forEach(q=>{const raw=state.answers[q.id];if(!raw)return;const v=q.reverse?5-raw:raw;totals[q.type]+=v-1;counts[q.type]++});
 return Object.fromEntries(L.map(k=>[k,counts[k]?Math.round(totals[k]/(counts[k]*3)*100):0]));
}
function characterCard(k){
 const t=TYPES[k],p=PROFILES[k],colors=TYPE_COLORS[k],c=COSTUME_SPEC[k];
 return `<article class="character-card ai-${k}" style="--c1:${colors[0]}66;--c2:${colors[1]}22"><span class="meet-badge">AI ${k}</span><div class="character-art">${p.image?`<img class="avatar-${k}" src="${p.image}" alt="${t.name}卡通角色">`:`<div class="css-mascot">${p.emoji}</div>`}<span class="costume-frame" aria-hidden="true"><span class="crest">${c.crest}</span><span class="role-label">${c.role}</span><span class="motif">${c.motif}</span></span></div><div class="character-copy"><div class="character-name">${t.icon} ${t.name}</div><div class="character-role">${t.title}</div><p class="character-quote">${p.quote}</p></div></article>`
}

function render(){
 if(!state.started){app.innerHTML=`<section class="screen center"><div class="card pad hero"><div class="robot">🤖</div><p class="eyebrow">研究知情的 AI 思考風格測驗</p><h1>你是哪一位 AI 夥伴？</h1><p class="sub">這是一個以六種AI角色作為隱喻的思考風格自我探索測試。你會回答20條隨機抽選的陳述，了解自己在創意、規劃、深度思考、探索、查證和邏輯解難方面的相對傾向。測試結果只供教育與自我反思，不代表臨床心理評估或固定人格標籤。</p><div class="types">${L.map(k=>`<div class="type-chip"><b>${TYPES[k].icon}</b>${TYPES[k].name}</div>`).join('')}</div><h2 class="intro-title">六種研究知情的思考風格</h2><p class="intro-sub">題目參考人格、認知投入、創意與開放思考研究重新撰寫，並非複製正式量表題目。</p><div class="role-key"><div style="--rk:#7c3aed"><span></span>ChatGPT・創意魔法師</div><div style="--rk:#dc2626"><span></span>Copilot・任務指揮官</div><div style="--rk:#2563eb"><span></span>Claude・沉思學者</div><div style="--rk:#16a34a"><span></span>Gemini・多媒體探險家</div><div style="--rk:#6b7280"><span></span>Perplexity・真相調查員</div><div style="--rk:#eab308"><span></span>DeepSeek・邏輯工程師</div></div><div class="character-grid">${L.map(k=>characterCard(k)).join('')}</div><button class="btn" onclick="start()">開始測試</button><p class="note">本工具屬教育及自我反思用途，尚未經獨立樣本進行信效度驗證，不應用於臨床、招聘或高風險決策。</p></div></section>`;return}
 if(state.done){renderResult();return}
 const q=state.questions[state.index],answered=Object.keys(state.answers).length,selected=state.answers[q.id];
 app.innerHTML=`<section class="screen"><div class="wrap"><div class="topline"><span>本次隨機測驗</span><span>${answered} / ${TEST_LENGTH} 已回答</span></div><div class="progress"><div class="bar" style="width:${((state.index+(selected?1:0))/TEST_LENGTH)*100}%"></div></div><section class="card question"><div class="qnum">第 ${state.index+1} 題 · 題庫編號 ${q.id}</div><h2>${q.text}</h2><div class="options">${RESPONSE_OPTIONS.map((o,idx)=>`<button class="option ${selected===o.value?'selected':''}" onclick="pick(${o.value})"><span class="letter">${idx+1}</span><span>${o.label}</span>${selected===o.value?'<span class="tick">✓</span>':''}</button>`).join('')}</div></section><div class="nav"><button class="btn alt" onclick="prev()" ${state.index===0?'disabled':''}>← 上一題</button>${state.index<TEST_LENGTH-1?`<button class="btn" onclick="next()" ${!selected?'disabled':''}>下一題 →</button>`:`<button class="btn" onclick="finish()" ${answered<TEST_LENGTH?'disabled':''}>查看結果 ✨</button>`}</div></div></section>`;
}



function fusionCharacter(a,b,m){
 const pa=PROFILES[a],pb=PROFILES[b],ca=TYPE_COLORS[a][0],cb=TYPE_COLORS[b][0];
 const wardrobe={A:'紫色星紋魔法袍＋燈泡法杖',B:'紅色雙排指揮服＋全息任務板',C:'藍色長版學者衣＋浮空書冊',D:'綠色多口袋探險裝＋智能相機',E:'灰色雙領調查風衣＋證據卡套',F:'黃色模組工程甲＋齒輪工具箱'};
 const props={A:'💡',B:'📋',C:'📖',D:'📷',E:'🔎',F:'⚙️'};
 return `<div class="fusion-stage" style="--mix-a:${ca};--mix-b:${cb}"><img class="fusion-character left avatar-${a}" src="${pa.image}" alt="${TYPES[a].name}角色元素"><img class="fusion-character right avatar-${b}" src="${pb.image}" alt="${TYPES[b].name}角色元素"><div class="fusion-core"><span>${props[a]}${props[b]}</span></div><div class="fusion-ribbon">${m.name}・雙特質融合形象</div></div><div class="fusion-costume"><span>${wardrobe[a]}</span><span>${wardrobe[b]}</span></div>`
}

function mixedProfile(keys){
 const pair=[...keys].sort(), code=pair.join(''), m=MIXED_DETAILS[code];
 if(!m){return `<div class="result-disclaimer">你的結果呈現多重而靈活的思考傾向。請把下方分數視為一張個人思考地圖，觀察你在不同情境中會啟動哪些方法。</div>`}
 const a=pair[0],b=pair[1],ca=TYPE_COLORS[a][0],cb=TYPE_COLORS[b][0];
 return `<div class="mixed-profile" style="--mix-a:${ca};--mix-b:${cb}">${fusionCharacter(a,b,m)}<section class="mixed-hero"><span class="mix-badge">${TYPES[a].icon} ${TYPES[a].name} × ${TYPES[b].icon} ${TYPES[b].name}</span><h3>${m.name}</h3><p class="mix-tagline">你不是兩種人格的簡單相加，而是把兩套思考力量組合成自己的方法。</p><p>${m.integration}</p></section><div class="mixed-pair"><section class="mixed-role" style="--mix-color:${ca}"><h4>${TYPES[a].name}為你帶來的力量</h4><p>${RESULT_DETAILS[a].performance}</p></section><section class="mixed-role" style="--mix-color:${cb}"><h4>${TYPES[b].name}為你帶來的力量</h4><p>${RESULT_DETAILS[b].performance}</p></section></div><section class="mixed-section"><h3>✨ 你的融合魅力</h3><p>${m.charm}</p></section><section class="mixed-section"><h3>⚠ 當兩種力量同時過強</h3><p>${m.blind}</p></section><section class="mixed-section"><h3>🌱 把組合優勢用得更成熟</h3><p>${m.growth}</p><p class="mixed-example"><strong>放進生活看看：</strong>${m.example}</p></section><section class="knowledge-box"><h3>📘 如何理解你的混合型</h3><p>這個結果表示本次作答中，兩種思考傾向同樣突出。你可能在不同情境中切換，也可能在同一任務內先後使用兩種方法。混合型並非矛盾，而是彈性。它也不是固定標籤，而是一個邀請：留意甚麼情境會令其中一種力量走到前台，以及另一種力量如何補位。</p><p class="source-links"><strong>研究脈絡：</strong>${RESULT_DETAILS[a].refs.join('；')}；${RESULT_DETAILS[b].refs.join('；')}。完整出處見下方文獻列表。</p></section></div>`
}

function detailedProfile(k){
 const d=RESULT_DETAILS[k];
 const sections=[
  ['🧭','研究構念',d.construct,'#7c3aed'],
  ['👤','你的人格表現',d.performance,'#2563eb'],
  ['✨','你的角色魅力',d.charm,'#db2777'],
  ['⚠','你可能遇到的盲點',d.blind,'#ea580c'],
  ['🌱','你的成長方向',d.growth,'#16a34a']
 ];
 return `<div class="deep-profile">${sections.map(([icon,title,text,color],i)=>`<section class="deep-section" style="--section-color:${color}"><span class="deep-icon">${icon}</span><h3>${title}</h3><p>${text}</p>${i===4?`<p class="life-example"><strong>生活例子：</strong>${d.example}</p>`:''}</section>`).join('')}</div><section class="knowledge-box"><h3>📘 相關心理學知識</h3><p>${d.knowledge}</p><p class="source-links"><strong>本段參考：</strong>${d.refs.join('；')}。完整出處見頁面下方文獻列表。</p></section><div class="result-disclaimer"><strong>如何閱讀這個結果：</strong>百分比分數表示你在本次20題中展現的相對傾向，不是人口百分位，也不是固定不變的身份。人格會受到情境、角色、經驗與發展階段影響；請把結果當成提出問題的起點，而不是替自己下定論。</div>`
}

function renderResult(){
 const s=scores(),ranked=[...L].sort((a,b)=>s[b]-s[a]),top=ranked[0],tied=ranked.filter(k=>Math.abs(s[k]-s[top])<=2),t=TYPES[top],p=PROFILES[top];
 const constructs={A:'創意想像、觀念開放與表達彈性',B:'盡責性、組織、持續力與責任感',C:'認知投入、深度理解與反思傾向',D:'探索廣度、跨媒體好奇與經驗開放',E:'證據敏感、延後定論與主動開放思考',F:'分析分解、系統推理與解難偏好'};
 app.innerHTML=`<section class="screen"><div class="card" style="margin:auto"><div class="result-head" style="background:linear-gradient(115deg,${TYPE_COLORS[top][0]},${TYPE_COLORS[top][1]},#f472b6,#facc15);background-size:250% 250%">${tied.length===1?(p.image?`<img class="result-character avatar-${top}" src="${p.image}" alt="${t.name}卡通角色">`:`<div class="result-mascot">${p.emoji}</div>`):`<div class="icon">🌈</div>`}<div>你的主要思考風格</div><h1>${tied.length>1?'混合型 AI 人格':t.name}</h1><h2>${tied.length>1?tied.map(k=>TYPES[k].name).join(' × '):t.title}</h2></div><div class="pad"><p class="desc">${tied.length>1?'你的最高分相近，表示你會按情境組合多種思考方式。':t.desc}</p>${tied.length===1?detailedProfile(top):mixedProfile(tied.slice(0,2))}${tied.length===1?`<div class="ai-profile"><div class="profile-box"><b>研究構念</b>${constructs[top]}</div><div class="profile-box"><b>人格表現</b>${p.personality}</div><div class="profile-box"><b>角色魅力</b>${p.charm}</div><div class="profile-box"><b>可能盲點</b>${p.weakness}</div></div><div class="info-grid"><div class="info"><b>核心長處</b>${t.strength}</div><div class="info"><b>成長方向</b>${t.growth}</div><div class="info"><b>互補拍檔</b>${t.partner}</div></div>`:''}<h2>標準化傾向分數</h2><p class="note" style="margin:0 0 14px">各類別按本次抽中的題數換算為0–100%，避免不同類別題數造成直接偏差。</p>${ranked.map(k=>`<div class="score-row"><div class="score-label"><span>${TYPES[k].icon} ${TYPES[k].name}</span><b>${s[k]}%</b></div><div class="track"><div class="fill" style="width:${s[k]}%"></div></div></div>`).join('')}<section class="research-notes"><h2>理論依據與限制</h2><p>本測驗以Big Five／BFI-2的開放性與盡責性、HEXACO六因素架構、Need for Cognition、Actively Open-Minded Thinking及Creative Personality研究作概念基礎。AI角色是教學隱喻，不等同正式心理診斷或原量表分數。</p><ol>${REFERENCES.map(r=>`<li>${r}</li>`).join('')}</ol></section><button class="btn alt" style="width:100%;margin-top:25px" onclick="resetQuiz()">↻ 重新抽取20題</button></div></div></section>`;
}
function start(){state={started:true,index:0,answers:{},done:false,questions:drawQuestions()};render();scrollTo(0,0)}
function prev(){if(state.index>0){state.index--;render()}}
function next(){const q=state.questions[state.index];if(state.answers[q.id]&&state.index<TEST_LENGTH-1){state.index++;render()}}
function pick(v){const q=state.questions[state.index];state.answers[q.id]=v;render();if(state.index<TEST_LENGTH-1)setTimeout(()=>{state.index++;render()},170)}
function finish(){if(Object.keys(state.answers).length===TEST_LENGTH){state.done=true;render();scrollTo(0,0)}}
function resetQuiz(){state={started:false,index:0,answers:{},done:false,questions:[]};render();scrollTo(0,0)}
render();
</script></body></html>
