<!doctype html>
<html lang="zh-HK">

<title>你是哪一位 AI 夥伴？</title>
<style>
:root{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color-scheme:dark;background:#020617;--cyan:#22d3ee;--muted:#94a3b8}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:#020617;color:#fff}.screen{min-height:100vh;padding:20px}.center{display:grid;place-items:center;background:radial-gradient(circle at top,#172554,#020617 58%)}.card{width:min(900px,100%);border:1px solid #ffffff1a;background:#ffffff0d;border-radius:28px;box-shadow:0 24px 70px #0008;overflow:hidden}.pad{padding:34px}.hero{text-align:center}.robot{font-size:72px}.eyebrow{color:#67e8f9;font-weight:800;letter-spacing:.16em}.hero h1{font-size:clamp(2.3rem,7vw,4rem);margin:10px 0}.sub{color:#cbd5e1;line-height:1.7;font-size:1.08rem;max-width:680px;margin:auto}.types{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:30px 0}.type-chip{padding:13px 6px;background:#ffffff0d;border-radius:16px;font-size:.75rem;color:#94a3b8}.type-chip b{display:block;font-size:1.8rem;margin-bottom:4px}.btn{border:0;border-radius:13px;padding:13px 20px;font-weight:800;font-size:1rem;cursor:pointer;background:#22d3ee;color:#082f49;transition:.2s}.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}.btn.alt{background:transparent;color:#fff;border:1px solid #ffffff33}.note{font-size:.78rem;color:#64748b;margin-top:18px}.wrap{width:min(780px,100%);margin:auto}.topline,.nav{display:flex;justify-content:space-between;align-items:center;gap:12px}.topline{font-size:.9rem;color:#94a3b8;margin-bottom:12px}.progress{height:8px;background:#ffffff1a;border-radius:100px;overflow:hidden;margin-bottom:28px}.bar{height:100%;background:linear-gradient(90deg,#22d3ee,#8b5cf6);transition:width .25s}.question{padding:28px}.qnum{color:#67e8f9;font-weight:800}.question h2{font-size:clamp(1.45rem,4vw,2rem);line-height:1.4;margin:14px 0 24px}.options{display:grid;gap:11px}.option{width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:15px;border-radius:16px;border:1px solid #ffffff1a;background:#ffffff0d;color:#fff;font-size:1rem;cursor:pointer;transition:.18s}.option:hover{background:#ffffff17;border-color:#ffffff55}.option.selected{border-color:#22d3ee;background:#22d3ee22}.letter{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#ffffff13;font-weight:900;flex:0 0 auto}.tick{margin-left:auto;color:#67e8f9}.nav{margin-top:18px}.result-head{text-align:center;padding:45px 28px;background:linear-gradient(135deg,#10b981,#0891b2)}.result-head .icon{font-size:70px}.result-head h1{font-size:clamp(2rem,6vw,3.2rem);margin:8px}.result-head h2{margin:0;font-size:clamp(1.25rem,4vw,1.8rem)}.desc{font-size:1.08rem;line-height:1.75;color:#e2e8f0}.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.info{background:#ffffff0d;border-radius:16px;padding:18px}.info b{display:block;color:#67e8f9;font-size:.85rem;margin-bottom:8px}.score-row{margin:15px 0}.score-label{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:6px}.track{height:11px;background:#ffffff18;border-radius:100px;overflow:hidden}.fill{height:100%;border-radius:100px;background:linear-gradient(90deg,#22d3ee,#8b5cf6)}@media(max-width:680px){.types{grid-template-columns:repeat(3,1fr)}.pad,.question{padding:22px}.info-grid{grid-template-columns:1fr}.option{padding:13px}.screen{padding:14px}}
</style>
</head>
<body><main id="app"></main>
<script>
const TYPES={
A:{name:"ChatGPT 型",title:"靈感奔流的創意魔法師",icon:"💡",color:"from-emerald-400 to-teal-600",desc:"你充滿想像力，擅長透過交流開拓可能性，並把抽象概念變得生動有趣。",strength:"創意、表達、靈活應變",growth:"篩選點子並核實資訊",partner:"Copilot 型、Perplexity 型"},
B:{name:"Microsoft Copilot 型",title:"沉着可靠的任務指揮官",icon:"🧭",color:"from-blue-400 to-indigo-600",desc:"你務實而有組織，擅長把零散想法整理成清晰計劃，推動團隊完成任務。",strength:"規劃、整理、執行",growth:"為探索與創意預留空間",partner:"ChatGPT 型、Gemini 型"},
C:{name:"Claude 型",title:"月光圖書館的沉思學者",icon:"📚",color:"from-amber-400 to-orange-600",desc:"你細膩、耐心，重視脈絡與深度，習慣理解不同觀點後才作判斷。",strength:"深度閱讀、分析、同理",growth:"設定思考時限，適時行動",partner:"Perplexity 型、Copilot 型"},
D:{name:"Gemini 型",title:"穿梭萬象的多媒體探險家",icon:"🌐",color:"from-violet-400 to-fuchsia-600",desc:"你好奇而開放，喜歡探索不同媒體與領域，並把看似無關的線索連結起來。",strength:"探索、跨學科、多媒體",growth:"收窄範圍並聚焦重點",partner:"DeepSeek 型、Claude 型"},
E:{name:"Perplexity 型",title:"追尋真相的銀徽記者",icon:"🔎",color:"from-cyan-400 to-sky-600",desc:"你理性而謹慎，重視來源與證據，會主動區分事實、意見與推測。",strength:"搜尋、查證、資訊判斷",growth:"接受資料不完整時仍可探索",partner:"ChatGPT 型、Claude 型"},
F:{name:"DeepSeek 型",title:"極速拆解的邏輯工程師",icon:"⚙️",color:"from-slate-500 to-slate-800",desc:"你冷靜、直接，善於找出規律，並把複雜問題拆成清晰而可處理的步驟。",strength:"推理、解難、系統思考",growth:"兼顧感受、文化與表達方式",partner:"Gemini 型、ChatGPT 型"}};
const L=["A","B","C","D","E","F"];
const RAW=[
["老師給你一個完全自由的專題，你首先會怎樣做？",["立即腦力激盪，想出幾個有趣主題","建立時間表，列出每週工作","先閱讀背景資料，真正理解題目","搜集圖片、影片、地圖等素材","尋找可靠來源，確認可引用資料","把專題拆成幾個小問題逐一解決"]],
["在小組討論中，你通常扮演甚麼角色？",["提出新點子，令討論更有活力","記錄決定、分配工作並提醒進度","聆聽不同意見，再深入分析","把不同同學的想法連結起來","提醒大家核實資料","找出問題核心及高效方案"]],
["遇上不熟悉的問題時，你會怎樣做？",["先與別人討論，從對話找靈感","找出可以立即採取的第一步","慢慢閱讀，了解背景與細節","從不同媒體和角度探索","搜尋可信來源的解釋","分析已知條件，再推演答案"]],
["如果要介紹一段歷史，你會選擇：",["寫成角色鮮明的故事","製作結構清晰的簡報","深入分析事件原因和影響","加入地圖、圖片、文物及影片","列出史料出處供觀眾查證","製作時間線呈現邏輯關係"]],
["朋友提出一個很好的計劃，你通常會說：",["我們還可以加入一些新元素！","誰負責甚麼？何時完成？","先想清楚它會帶來甚麼影響。","可參考其他地方的類似做法。","這些資料和假設可靠嗎？","這是最簡單有效的方法嗎？"]],
["哪一種課堂最能吸引你？",["可自由創作和即興發揮","目標步驟清晰並能完成作品","可深入討論和分析觀點","有圖片、影片及跨學科內容","可調查問題、比較資料真偽","可解謎、推理或進行實驗"]],
["閱讀長文章時，你最自然的做法是：",["想像如何改編成有趣形式","把重點整理成筆記和清單","留意語氣、觀點和論證結構","尋找相關圖片和延伸材料","檢查文章引用了哪些證據","整理成因果關係或邏輯圖"]],
["要記憶大量內容時，你偏好：",["編成故事、口訣或聯想","製作分類整齊的溫習表","先理解內容，避免純粹背誦","使用圖像、顏色或心智圖","查找例證，確認概念含義","找出規律，以規則減少記憶量"]],
["答案與參考答案不同時，你會：",["思考自己的答案是否是另一種可能","對照要求，找出遺漏步驟","比較兩種答案背後的觀點","尋找更多例子作全面比較","檢查參考答案的資料來源","重新推演，找出錯誤位置"]],
["你最希望收到哪種評語？",["你的想法很有創意","作品完整而且組織良好","分析深入，很有思考","能連結不同知識，視野很廣","證據充分，資料運用可靠","推理清晰，解決方法有效"]],
["小組只剩一天便要交功課，你會：",["提出簡單但吸引的新方向","立即重新分工，確保按時完成","檢查內容是否前後一致","補充最能提升效果的視覺素材","核對重要資料和來源","刪除不必要部分，集中核心任務"]],
["兩位組員意見不合時，你通常會：",["提出融合雙方創意的第三方案","提醒共同目標，推動作出決定","聆聽雙方理由，理解分歧來源","從其他案例尋找新方向","要求雙方提供證據","比較成本、條件和效果"]],
["你最欣賞哪一種隊友？",["令大家充滿靈感的人","答應了便完成工作的人","願意聆聽和認真思考的人","見識廣博並帶來新發現的人","說話有根據的人","能看穿問題並提出解法的人"]],
["匯報時突然出現技術故障，你會：",["即場發揮，用故事繼續介紹","啟用後備方案，維持進度","冷靜說明，不讓故障影響思路","改用現場物件或其他媒體","確保口述的重要資料仍準確","快速判斷原因並嘗試修復"]],
["團隊完成任務後，你最想：",["討論下次可加入的新玩法","整理檔案並記錄改善事項","反思過程與學習所得","把成果改成影片或網頁分享","檢查最終版本有沒有資料錯誤","分析耗時步驟並尋找優化方法"]],
["網上出現一則驚人消息，你的第一反應是：",["想像若是真的會帶來甚麼改變","儲存下來，稍後整理跟進","思考背後背景和可能含義","搜尋相關圖片、影片和報道","查找原始來源及可靠媒體","分析內容是否矛盾或不合邏輯"]],
["資料來源互相矛盾時，你會：",["提出幾種可能解釋","建立比較表整理差異","分析作者立場、語境和用詞","擴大搜尋，找不同形式證據","追查第一手資料和發布日期","比較證據能否支持結論"]],
["面對沒有標準答案的問題，你會感到：",["興奮，因為可自由發揮","有挑戰，但想建立完成標準","有興趣，因為可深入思考","好奇，因為可探索很多方向","謹慎，因為要分辨事實與意見","專注，因為可建立推理模型"]],
["如果一個答案聽起來很合理，你會：",["用它發展更多想法","思考如何轉化成實際行動","檢視是否忽略其他觀點","尋找更多背景和例子","查核答案所依據的來源","測試在不同條件下是否成立"]],
["你最不能接受哪種情況？",["所有人只接受同一種想法","討論很多，最後甚麼也沒完成","未理解問題便急着下結論","只從單一角度看世界","沒有證據卻當成事實","有簡單方法卻把事情複雜化"]],
["如果可以獲得一種超能力，你會選擇：",["把想像立即變成現實","同時管理很多任務而不混亂","看懂話語背後的真正意思","瞬間到世界各地探索","一眼看穿謊言和假消息","立即理解所有系統的原理"]],
["哪句說話最能代表你？",["凡事總有另一種可能","好想法需要真正落實","理解比快速回答更重要","世界比我們看見的更廣闊","先看證據，再作判斷","複雜問題也可以逐步拆解"]],
["你心目中最理想的工作空間是：",["有白板與創意小物的工作室","文件有序、設備齊全的指揮中心","安靜舒適的圖書館","有螢幕、地圖與影像的探索室","滿是檔案和資料庫的調查室","有電腦、工具和模型的實驗室"]],
["完成作品時，甚麼最令你有成功感？",["作品令人眼前一亮","所有部分按計劃完成","作品具有深入觀點","作品呈現豐富多元內容","每個重要說法都有可靠證據","找到清晰有效的解決方法"]],
["若成為AI智慧學院導師，你最想教學生：",["突破框架，勇敢創作","做好規劃，付諸實行","深入閱讀，理解不同觀點","探索世界，連結不同知識","辨別真偽，養成查證習慣","拆解問題，運用邏輯解難"]]
];
const Q=RAW.map(([q,o])=>({q,o:o.map((text,i)=>({type:L[i],text}))}));
let state={started:false,index:0,answers:{},done:false};
const app=document.getElementById('app');
function scores(){return Object.fromEntries(L.map(k=>[k,Object.values(state.answers).filter(v=>v===k).length]));}
function render(){
 if(!state.started){app.innerHTML=`<section class="screen center"><div class="card pad hero"><div class="robot">🤖</div><p class="eyebrow">AI 智慧學院入學測驗</p><h1>你是哪一位 AI 夥伴？</h1><p class="sub">完成25個情境題，探索你的創意、執行、思考、探索、查證與解難傾向。</p><div class="types">${L.map(k=>`<div class="type-chip"><b>${TYPES[k].icon}</b>${TYPES[k].name}</div>`).join('')}</div><button class="btn" onclick="start()">開始測驗 ✨</button><p class="note">本測驗只供趣味探索與教學活動使用，並非專業心理評估。</p></div></section>`;return }
 if(state.done){renderResult();return}
 const q=Q[state.index], answered=Object.keys(state.answers).length, selected=state.answers[state.index];
 app.innerHTML=`<section class="screen"><div class="wrap"><div class="topline"><span>AI 人格測驗</span><span>${answered} / 25 已回答</span></div><div class="progress"><div class="bar" style="width:${((state.index+(selected?1:0))/25)*100}%"></div></div><section class="card question"><div class="qnum">第 ${state.index+1} 題</div><h2>${q.q}</h2><div class="options">${q.o.map(o=>`<button class="option ${selected===o.type?'selected':''}" onclick="pick('${o.type}')"><span class="letter">${o.type}</span><span>${o.text}</span>${selected===o.type?'<span class="tick">✓</span>':''}</button>`).join('')}</div></section><div class="nav"><button class="btn alt" onclick="prev()" ${state.index===0?'disabled':''}>← 上一題</button>${state.index<24?`<button class="btn" onclick="next()" ${!selected?'disabled':''}>下一題 →</button>`:`<button class="btn" onclick="finish()" ${answered<25?'disabled':''}>查看結果 ✨</button>`}</div></div></section>`;
}
function renderResult(){const s=scores(),ranked=[...L].sort((a,b)=>s[b]-s[a]),top=ranked[0],tied=ranked.filter(k=>s[k]===s[top]),t=TYPES[top];app.innerHTML=`<section class="screen"><div class="card" style="margin:auto"><div class="result-head"><div class="icon">${tied.length>1?'🌈':t.icon}</div><div>你的測驗結果</div><h1>${tied.length>1?'混合型 AI 人格':t.name}</h1><h2>${tied.length>1?tied.map(k=>TYPES[k].name).join(' × '):t.title}</h2></div><div class="pad">${tied.length===1?`<p class="desc">${t.desc}</p><div class="info-grid"><div class="info"><b>你的長處</b>${t.strength}</div><div class="info"><b>成長任務</b>${t.growth}</div><div class="info"><b>最佳拍檔</b>${t.partner}</div></div>`:`<p class="desc">你能按情境轉換思考方式。最高分角色為：${tied.map(k=>TYPES[k].icon+' '+TYPES[k].name).join('、')}。</p>`}<h2>人格能量分布</h2>${ranked.map(k=>`<div class="score-row"><div class="score-label"><span>${TYPES[k].icon} ${TYPES[k].name}</span><b>${s[k]} 分</b></div><div class="track"><div class="fill" style="width:${s[k]/25*100}%"></div></div></div>`).join('')}<button class="btn alt" style="width:100%;margin-top:25px" onclick="resetQuiz()">↻ 重新測驗</button></div></div></section>`}
function start(){state.started=true;render()} function prev(){if(state.index>0){state.index--;render()}} function next(){if(state.answers[state.index]&&state.index<24){state.index++;render()}} function pick(t){state.answers[state.index]=t;render();if(state.index<24)setTimeout(()=>{state.index++;render()},170)} function finish(){if(Object.keys(state.answers).length===25){state.done=true;render();scrollTo(0,0)}} function resetQuiz(){state={started:false,index:0,answers:{},done:false};render();scrollTo(0,0)}
render();
</script></body></html>
